server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # پشت Traefik هستیم؛ فشرده‌سازی همین‌جا انجام می‌شود
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # فایل‌های هش‌دار next تغییرناپذیرند
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # service worker و manifest هرگز کش نشوند وگرنه آپدیت PWA گیر می‌کند
    location ~ ^/(sw\.js|workbox-[^/]+\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # مسیرهای داینامیک: خروجی export فقط پوسته‌ی «[id]» را می‌سازد، نه صفحه‌ای
    # به‌ازای هر شناسه. همان پوسته سرو می‌شود و روتر سمت کلاینت id را از URL
    # می‌خواند. بدون این سه بلاک، /orderdetail/21/ روی سرور 404 می‌دهد.
    location ~ "^/orderdetail/[^/]+/?$" {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files "/orderdetail/[id]/index.html" =404;
    }

    location ~ "^/searching/[^/]+/?$" {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files "/searching/[id]/index.html" =404;
    }

    location ~ "^/admin/users/[^/]+/transactions/?$" {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files "/admin/users/[userId]/transactions/index.html" =404;
    }

    # trailingSlash:true است، پس /foo -> /foo/index.html
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    error_page 404 /404.html;
}
